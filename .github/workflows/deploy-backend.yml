name: Deploy API to Azure Container Apps

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

permissions:
  id-token: write   # lets GitHub prove its identity to Azure (no stored password)
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: mvn -B verify
        working-directory: backend

  deploy:
    needs: test
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ vars.ACR_NAME }}.azurecr.io/tickets-api:${{ github.sha }}
      API_URL: ${{ vars.VITE_API_BASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push the image to Azure Container Registry
        run: |
          az acr login --name "${{ vars.ACR_NAME }}"
          docker build -t "$IMAGE" backend
          docker push "$IMAGE"

      - name: Roll out a new revision
        run: |
          wait_for_api() {
            local failure_message="$1"
            local health_status="request failed"

            for attempt in {1..30}; do
              health_status=$(curl --silent --output /dev/null --write-out '%{http_code}' --connect-timeout 5 --max-time 10 "$API_URL/actuator/health" || true)
              if [[ "$health_status" == "200" ]]; then
                return 0
              fi
              if [[ "$attempt" == 30 ]]; then
                echo "$failure_message Last health-check HTTP status: ${health_status:-request failed}."
                az containerapp revision list \
                  --name "${{ vars.ACA_APP_NAME }}" \
                  --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
                  --query "[?properties.active].{revision:name,state:properties.runningState,health:properties.healthState,replicas:properties.replicas}" \
                  --output table
                az containerapp logs show \
                  --name "${{ vars.ACA_APP_NAME }}" \
                  --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
                  --type system \
                  --tail 30 || true
                return 1
              fi
              sleep 10
            done
          }

          az containerapp update \
            --name "${{ vars.ACA_APP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --image "$IMAGE"

          wait_for_api "The API did not become healthy after the image update." || exit 1

          DB_USER=$(az containerapp show \
            --name "${{ vars.ACA_APP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --query "properties.template.containers[0].env[?name=='DB_USER'].value | [0]" \
            --output tsv)

          if [[ "$DB_USER" != "tickets_app" ]]; then
            az containerapp update \
              --name "${{ vars.ACA_APP_NAME }}" \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --set-env-vars DB_USER=tickets_app DB_PASSWORD=secretref:db-app-password

            wait_for_api "The API did not become healthy after switching to its application database login." || exit 1
          fi
