name: Deploy API to Azure Container Apps

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

permissions:
  id-token: write   # lets GitHub prove its identity to Azure (no stored password)
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: mvn -B verify
        working-directory: backend

  deploy:
    needs: test
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ vars.ACR_NAME }}.azurecr.io/tickets-api:${{ github.sha }}
      API_URL: ${{ vars.VITE_API_BASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push the image to Azure Container Registry
        run: |
          az acr login --name "${{ vars.ACR_NAME }}"
          docker build -t "$IMAGE" backend
          docker push "$IMAGE"

      - name: Roll out a new revision
        run: |
          az containerapp update \
            --name "${{ vars.ACA_APP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --image "$IMAGE"

          for attempt in {1..30}; do
            if curl --fail --silent "$API_URL/actuator/health" >/dev/null; then
              break
            fi
            if [[ "$attempt" == 30 ]]; then
              echo "The API did not become healthy after the image update."
              exit 1
            fi
            sleep 10
          done

          DB_USER=$(az containerapp show \
            --name "${{ vars.ACA_APP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --query "properties.template.containers[0].env[?name=='DB_USER'].value | [0]" \
            --output tsv)

          if [[ "$DB_USER" != "tickets_app" ]]; then
            az containerapp update \
              --name "${{ vars.ACA_APP_NAME }}" \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --set-env-vars DB_USER=tickets_app DB_PASSWORD=secretref:db-app-password

            for attempt in {1..30}; do
              if curl --fail --silent "$API_URL/actuator/health" >/dev/null; then
                break
              fi
              if [[ "$attempt" == 30 ]]; then
                echo "The API did not become healthy after switching to its application database login."
                exit 1
              fi
              sleep 10
            done
          fi
