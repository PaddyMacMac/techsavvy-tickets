# Every value comes from environment variables set on the Azure Container App (see docs/DEPLOYMENT-GUIDE.md).
spring:
  flyway:
    placeholders:
      ticketsAppPassword: ${DB_APP_PASSWORD}
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

app:
  entra:
    tenant-id: ${ENTRA_TENANT_ID}
    client-id: ${ENTRA_CLIENT_ID}
